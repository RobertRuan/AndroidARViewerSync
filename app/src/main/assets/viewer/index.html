<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AR Viewer Sync</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;   /* let Android camera preview show through */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: transparent;
  }
  canvas {
    display: block;
    background: transparent;
    width: 100% !important;
    height: 100% !important;
  }
  #err {
    position: absolute;
    left: 12px;
    top: 12px;
    color: #ff5252;
    font-family: monospace;
    font-size: 12px;
    background: rgba(0,0,0,0.6);
    padding: 6px 8px;
    border-radius: 6px;
    max-width: 90vw;
    white-space: pre-wrap;
    display: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="err"></div>

<!-- ES module import map: map 'three' bare specifier to the vendored build.
     Works on Android WebView Chromium 80+ (Android 8+/Play-updated 7+). -->
<script type="importmap">
{
  "imports": {
    "three": "./three.module.min.js",
    "three/addons/": "./"
  }
}
</script>

<script type="module" src="./viewer.js"></script>
</body>
</html>
